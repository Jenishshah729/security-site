
<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      margin: 0;
      padding: 0;
      width: 768px;
      height: 1376px;
      background: #000;
      overflow: hidden;
    }
    #c {
      width: 768px;
      height: 1376px;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 10;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "file:///C:/Users/Admin/OneDrive/Pictures/Documents/thejenishshah/backend/node_modules/three/build/three.module.js"
      }
    }
  </script>
</head>
<body>
  <canvas id="c"></canvas>
  <script type="module">
    import * as THREE from 'three';

    const canvas = document.getElementById('c');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
    renderer.setSize(768, 1376);
    renderer.setPixelRatio(2);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.25;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;

    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(40, 768 / 1376, 0.1, 1000);
    camera.position.set(0, 0, 10);

    // Environment Lighting
    const ambientLight = new THREE.AmbientLight(0x1e293b, 1.4);
    scene.add(ambientLight);

    // Key Light: Crisp warm light from top-left
    const keyLight = new THREE.DirectionalLight(0xfff5ea, 3.8);
    keyLight.position.set(-6, 9, 8);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.width = 2048;
    keyLight.shadow.mapSize.height = 2048;
    keyLight.shadow.bias = -0.001;
    scene.add(keyLight);

    // Rim Light: Cyber blue-white specular highlight from top-left edge
    const rimLight = new THREE.DirectionalLight(0x7dd3fc, 2.5);
    rimLight.position.set(-8, 4, 3);
    scene.add(rimLight);

    // Warm bounce light from bottom-right (simulates copper wire reflections)
    const bounceLight = new THREE.DirectionalLight(0xff7700, 2.8);
    bounceLight.position.set(7, -6, 3);
    scene.add(bounceLight);

    // Helper: Rounded Rectangle Shape
    function createRoundedRectShape(w, h, r) {
      const shape = new THREE.Shape();
      const x = -w / 2;
      const y = -h / 2;
      shape.moveTo(x + r, y);
      shape.lineTo(x + w - r, y);
      shape.quadraticCurveTo(x + w, y, x + w, y + r);
      shape.lineTo(x + w, y + h - r);
      shape.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      shape.lineTo(x + r, y + h);
      shape.quadraticCurveTo(x, y + h, x, y + h - r);
      shape.lineTo(x, y + r);
      shape.quadraticCurveTo(x, y, x + r, y);
      return shape;
    }

    // --- 1. CHASSIS / METALLIC OUTER FRAME ---
    const chassisShape = createRoundedRectShape(3.8, 3.8, 0.8);
    const chassisGeom = new THREE.ExtrudeGeometry(chassisShape, {
      depth: 0.5,
      bevelEnabled: true,
      bevelSegments: 16,
      steps: 2,
      bevelSize: 0.18,
      bevelThickness: 0.18
    });
    chassisGeom.center();

    // Dark Titanium Chassis Material
    const chassisMat = new THREE.MeshPhysicalMaterial({
      color: 0x1e2530,
      metalness: 0.85,
      roughness: 0.22,
      clearcoat: 0.4,
      clearcoatRoughness: 0.2
    });
    const chassisMesh = new THREE.Mesh(chassisGeom, chassisMat);
    chassisMesh.castShadow = true;
    chassisMesh.receiveShadow = true;

    // --- 2. INNER METALLIC BEVEL RIM ---
    const rimShape = createRoundedRectShape(3.5, 3.5, 0.7);
    const rimGeom = new THREE.ExtrudeGeometry(rimShape, {
      depth: 0.1,
      bevelEnabled: true,
      bevelSegments: 12,
      steps: 1,
      bevelSize: 0.08,
      bevelThickness: 0.08
    });
    rimGeom.center();

    const silverRimMat = new THREE.MeshPhysicalMaterial({
      color: 0x94a3b8,
      metalness: 0.95,
      roughness: 0.12,
      clearcoat: 0.8
    });
    const rimMesh = new THREE.Mesh(rimGeom, silverRimMat);
    rimMesh.position.z = 0.26;

    // --- 3. THE 3D BURP SUITE LOGO EMBLEM ---
    // In Image 3, the logo is an orange squircle with the white fracture path
    const logoShape = createRoundedRectShape(3.2, 3.2, 0.65);
    const logoGeom = new THREE.ExtrudeGeometry(logoShape, {
      depth: 0.18,
      bevelEnabled: true,
      bevelSegments: 16,
      steps: 2,
      bevelSize: 0.09,
      bevelThickness: 0.09
    });
    logoGeom.center();

    const orangeMat = new THREE.MeshPhysicalMaterial({
      color: 0xFD7D00, // Burp Suite signature orange
      emissive: 0x220c00,
      metalness: 0.06,
      roughness: 0.14,
      clearcoat: 1.0,
      clearcoatRoughness: 0.06,
      reflectivity: 0.9
    });
    const logoMesh = new THREE.Mesh(logoGeom, orangeMat);
    logoMesh.position.z = 0.36;
    logoMesh.receiveShadow = true;

    // --- 4. THE 3D LIGHTNING / FRACTURE CUTOUT & CORE ---
    // Exact mathematical coordinates of the Burp Suite fracture ribbon from Image 3
    // Image 3 has width=312, height=320, logo width ~ 296
    const s = 3.2 / 296;
    const cx = 154;
    const cy = 162;

    const crackShape = new THREE.Shape();
    
    // Left boundary of the white ribbon:
    // (140, 18) -> (140, 48) -> (65, 145) -> (140, 145) -> (140, 306)
    // Right boundary of the white ribbon:
    // (169, 306) -> (169, 265) -> (245, 175) -> (169, 175) -> (169, 18)
    
    crackShape.moveTo((140 - cx)*s, -(18 - cy)*s);
    crackShape.lineTo((140 - cx)*s, -(48 - cy)*s);
    crackShape.lineTo((65 - cx)*s, -(145 - cy)*s);
    crackShape.lineTo((140 - cx)*s, -(145 - cy)*s);
    crackShape.lineTo((140 - cx)*s, -(306 - cy)*s);
    
    crackShape.lineTo((169 - cx)*s, -(306 - cy)*s);
    crackShape.lineTo((169 - cx)*s, -(265 - cy)*s);
    crackShape.lineTo((245 - cx)*s, -(175 - cy)*s);
    crackShape.lineTo((169 - cx)*s, -(175 - cy)*s);
    crackShape.lineTo((169 - cx)*s, -(18 - cy)*s);
    crackShape.closePath();

    const crackGeom = new THREE.ExtrudeGeometry(crackShape, {
      depth: 0.12,
      bevelEnabled: true,
      bevelSegments: 8,
      steps: 1,
      bevelSize: 0.03,
      bevelThickness: 0.03
    });
    crackGeom.center();

    // Pure White Glowing Resin Material
    const whiteMat = new THREE.MeshPhysicalMaterial({
      color: 0xffffff,
      emissive: 0xfffbf5,
      emissiveIntensity: 0.35,
      roughness: 0.08,
      metalness: 0.0,
      clearcoat: 1.0,
      clearcoatRoughness: 0.03
    });
    const crackMesh = new THREE.Mesh(crackGeom, whiteMat);
    crackMesh.position.z = 0.46; // Sits embossed on the front face of the orange logo

    // Assemble the complete 3D Module
    const moduleGroup = new THREE.Group();
    moduleGroup.add(chassisMesh);
    moduleGroup.add(rimMesh);
    moduleGroup.add(logoMesh);
    moduleGroup.add(crackMesh);

    // Match the exact 3D perspective angle of Image 1
    moduleGroup.rotation.x = THREE.MathUtils.degToRad(11);
    moduleGroup.rotation.y = THREE.MathUtils.degToRad(-16);
    moduleGroup.rotation.z = THREE.MathUtils.degToRad(-5.5);
    moduleGroup.position.set(-0.24, 0.46, 0);

    scene.add(moduleGroup);

    renderer.render(scene, camera);
    window.renderComplete = true;
    console.log('High-fidelity 3D module rendered!');
  </script>
</body>
</html>
