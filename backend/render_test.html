
<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: transparent;
      width: 768px;
      height: 1376px;
    }
    #c {
      width: 768px;
      height: 1376px;
      display: block;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "file:///C:/Users/Admin/OneDrive/Pictures/Documents/thejenishshah/backend/node_modules/three/build/three.module.js"
      }
    }
  </script>
</head>
<body>
  <canvas id="c"></canvas>
  <script type="module">
    import * as THREE from 'three';
    window.THREE = THREE;

    const canvas = document.getElementById('c');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
    renderer.setSize(768, 1376);
    renderer.setPixelRatio(2);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.3;

    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(40, 768 / 1376, 0.1, 1000);
    camera.position.set(0, 0, 10);

    // Warm high-contrast directional lighting to match the cyber cover
    const ambientLight = new THREE.AmbientLight(0x1a2638, 1.2);
    scene.add(ambientLight);

    const keyLight = new THREE.DirectionalLight(0xfff0dd, 3.5);
    keyLight.position.set(-6, 9, 8);
    scene.add(keyLight);

    const rimLight = new THREE.DirectionalLight(0x70b5ff, 2.2);
    rimLight.position.set(-7, 4, 4);
    scene.add(rimLight);

    const bounceLight = new THREE.DirectionalLight(0xff7700, 2.5);
    bounceLight.position.set(7, -5, 3);
    scene.add(bounceLight);

    // Rounded rectangle function
    function createRoundedRectShape(w, h, r) {
      const shape = new THREE.Shape();
      const x = -w / 2;
      const y = -h / 2;
      shape.moveTo(x + r, y);
      shape.lineTo(x + w - r, y);
      shape.quadraticCurveTo(x + w, y, x + w, y + r);
      shape.lineTo(x + w, y + h - r);
      shape.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      shape.lineTo(x + r, y + h);
      shape.quadraticCurveTo(x, y + h, x, y + h - r);
      shape.lineTo(x, y + r);
      shape.quadraticCurveTo(x, y, x + r, y);
      return shape;
    }

    // Outer 3D badge base
    const baseShape = createRoundedRectShape(3.3, 3.3, 0.65);
    const extrudeSettings = {
      depth: 0.45,
      bevelEnabled: true,
      bevelSegments: 16,
      steps: 2,
      bevelSize: 0.14,
      bevelThickness: 0.14
    };

    const geometry = new THREE.ExtrudeGeometry(baseShape, extrudeSettings);
    geometry.center();

    // Glossy Vibrant Burp Suite Orange (#FD7D00)
    const orangeMaterial = new THREE.MeshPhysicalMaterial({
      color: 0xFD7D00,
      emissive: 0x2b0f00,
      roughness: 0.15,
      metalness: 0.08,
      clearcoat: 1.0,
      clearcoatRoughness: 0.08,
      reflectivity: 0.95
    });

    const badgeMesh = new THREE.Mesh(geometry, orangeMaterial);
    
    // Lightning fracture polygon
    const crackShape = new THREE.Shape();
    const s = 3.3 / 290;
    const cx = 154;
    const cy = 162;

    const crackLeft = [
      [(140 - cx)*s, -(18 - cy)*s],
      [(140 - cx)*s, -(45 - cy)*s],
      [(65 - cx)*s, -(145 - cy)*s],
      [(140 - cx)*s, -(145 - cy)*s],
      [(140 - cx)*s, -(175 - cy)*s],
      [(140 - cx)*s, -(200 - cy)*s],
      [(182 - cx)*s, -(215 - cy)*s],
      [(140 - cx)*s, -(265 - cy)*s],
      [(140 - cx)*s, -(306 - cy)*s]
    ];
    const crackRight = [
      [(169 - cx)*s, -(306 - cy)*s],
      [(169 - cx)*s, -(265 - cy)*s],
      [(215 - cx)*s, -(215 - cy)*s],
      [(245 - cx)*s, -(180 - cy)*s],
      [(169 - cx)*s, -(180 - cy)*s],
      [(169 - cx)*s, -(145 - cy)*s],
      [(169 - cx)*s, -(45 - cy)*s],
      [(169 - cx)*s, -(18 - cy)*s]
    ];

    crackShape.moveTo(crackLeft[0][0], crackLeft[0][1]);
    for (let i = 1; i < crackLeft.length; i++) {
      crackShape.lineTo(crackLeft[i][0], crackLeft[i][1]);
    }
    for (let i = 0; i < crackRight.length; i++) {
      crackShape.lineTo(crackRight[i][0], crackRight[i][1]);
    }
    crackShape.closePath();

    const crackExtrudeSettings = {
      depth: 0.16,
      bevelEnabled: true,
      bevelSegments: 8,
      steps: 1,
      bevelSize: 0.035,
      bevelThickness: 0.035
    };

    const crackGeometry = new THREE.ExtrudeGeometry(crackShape, crackExtrudeSettings);
    crackGeometry.center();

    // Pure White Embossed Bolt
    const whiteMaterial = new THREE.MeshPhysicalMaterial({
      color: 0xffffff,
      emissive: 0xffffff,
      emissiveIntensity: 0.28,
      roughness: 0.1,
      metalness: 0.0,
      clearcoat: 1.0,
      clearcoatRoughness: 0.04
    });

    const crackMesh = new THREE.Mesh(crackGeometry, whiteMaterial);
    crackMesh.position.z = 0.35; // Embossed directly on the face

    const logoGroup = new THREE.Group();
    logoGroup.add(badgeMesh);
    logoGroup.add(crackMesh);

    // 3D Angle matching the perspective of the cyber module in Image 1
    logoGroup.rotation.x = THREE.MathUtils.degToRad(10);
    logoGroup.rotation.y = THREE.MathUtils.degToRad(-15);
    logoGroup.rotation.z = THREE.MathUtils.degToRad(-5);
    logoGroup.position.set(-0.15, 0.48, 0);

    scene.add(logoGroup);

    renderer.render(scene, camera);
    window.renderComplete = true;
    console.log('Scene rendered!');
  </script>
</body>
</html>
